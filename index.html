<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>URBEX · Explora tu ciudad al 100%</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>🧭 URBEX</h1>
      <p class="subtitle">Exploración urbana gamificada</p>
    </header>

    <section class="panel">
      <h2>Progreso en la zona visible</h2>
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar"></div></div>
        <span id="stat-percent">0%</span>
      </div>
      <div class="stats-grid">
        <div class="stat">
          <span class="stat-label">Exploradas</span>
          <span id="stat-explored" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Totales</span>
          <span id="stat-total" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Distancia</span>
          <span id="stat-distance" class="stat-value">0 km</span>
        </div>
        <div class="stat">
          <span class="stat-label">Logros</span>
          <span id="stat-achievements" class="stat-value">0</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Controles</h2>
      <button id="toggle-tracking" class="btn btn-primary">▶ Iniciar tracking</button>
      <button id="suggest-route" class="btn">🎯 Sugerir ruta nueva</button>
      <button id="center-me" class="btn">📍 Centrar en mí</button>
      <button id="simulate" class="btn btn-ghost" title="Marca la calle más cercana al clic sin moverse">🧪 Modo simulación</button>
      <button id="reset" class="btn btn-danger">🗑 Reiniciar progreso</button>
    </section>

    <section class="panel legend">
      <h2>Leyenda</h2>
      <div><span class="swatch swatch-unexplored"></span> No explorada</div>
      <div><span class="swatch swatch-explored"></span> Explorada</div>
      <div><span class="swatch swatch-suggested"></span> Sugerida</div>
      <div><span class="swatch swatch-path"></span> Tu recorrido</div>
    </section>

    <section class="panel" id="achievements-panel">
      <h2>Últimos logros</h2>
      <ul id="achievements-list" class="achievements-list">
        <li class="empty">Camina para desbloquear logros</li>
      </ul>
    </section>

    <footer>
      <small>Mapa © OpenStreetMap · Datos vía Overpass API</small>
    </footer>
  </aside>

  <main id="map"></main>

  <div id="status" class="status hidden"><span id="status-text"></span></div>
  <div id="toast-container" class="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/overpass.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/map.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
